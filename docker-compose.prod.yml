# Production : Nginx (TLS) -> Gunicorn/Django -> PostgreSQL. Seul Nginx est exposé.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: portfolio-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/srv/media
      - frontend:/srv/frontend
      - static:/srv/static-public
      - logs:/srv/app/logs
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/portfolio.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - frontend:/srv/frontend:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  media:
  frontend:
  static:
  logs:
  certbot-www:

networks:
  backend:
    internal: true   # PostgreSQL n'est joignable que par le conteneur web
  frontend:
