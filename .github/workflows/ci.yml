name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Annule les exécutions obsolètes d'une même branche (jamais sur main, pour ne pas interrompre un déploiement).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit des dépendances (vulnérabilités connues)
        run: npm audit --omit=dev --audit-level=high
      - name: Construction (Vite)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio_v2
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdefghijklmnopqrstuvwxyz
      IP_HASH_SALT: ci-only-ip-hash-salt-not-used-anywhere-else
      POSTGRES_DB: portfolio_v2
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Analyse statique
        run: |
          ruff --version
          ruff check . --output-format github
      - name: Audit des dépendances (vulnérabilités connues)
        run: pip-audit -r requirements/base.txt
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests
        run: coverage run manage.py test --settings=config.settings.test && coverage report --fail-under=85
      - name: Configuration de production
        env:
          DJANGO_ALLOWED_HOSTS: example.com
          SITE_URL: https://example.com
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

  # Vérifie que l'image de production se construit (frontend + backend).
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: portfolio-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Déploiement continu : uniquement sur push vers main, une fois tous les contrôles passés.
  # Activé par la variable de dépôt DEPLOY_ENABLED=true (voir DEPLOYMENT.md, section CI/CD).
  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configuration SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Déploiement sur le serveur
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd /opt/portfolio && git fetch --prune origin && git reset --hard ${{ github.sha }} && sh deploy/scripts/deploy.sh ${{ github.sha }}"
      - name: Vérification de la sonde /healthz/
        if: vars.SITE_URL != ''
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.SITE_URL }}/healthz/"
