# Remplacez votredomaine.tld par votre domaine. Certificats : Let's Encrypt (voir DEPLOYMENT.md).
server_tokens off;
client_max_body_size 12m;

# Couche de limitation supplémentaire, en amont de celle de Django.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=contact:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

upstream django {
    server web:8000;
    keepalive 16;
}

map $uri $static_cache {
    # Fichiers JS/CSS produits par Vite : nom avec empreinte, donc immuables.
    ~*^/assets/app/         "public, max-age=31536000, immutable";
    ~*\.(woff2|svg|png|webp|avif)$  "public, max-age=2592000";
    ~*\.(css|js)$           "public, max-age=3600, must-revalidate";
    default                 "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name votredomaine.tld www.votredomaine.tld;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://votredomaine.tld$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.votredomaine.tld;
    ssl_certificate     /etc/letsencrypt/live/votredomaine.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votredomaine.tld/privkey.pem;
    return 301 https://votredomaine.tld$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name votredomaine.tld;

    ssl_certificate     /etc/letsencrypt/live/votredomaine.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votredomaine.tld/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;
    gzip_vary on;

    root /srv/frontend;
    index index.html;
    error_page 404 /404.html;

    # Fichiers cachés (.env, .git…) : jamais servis.
    location ~ /\. { deny all; return 404; }

    # ---- Application Django (API, dashboard, sonde) ----
    location = /api/v1/auth/login/ { limit_req zone=auth burst=5 nodelay; include /etc/nginx/snippets/proxy.conf; }
    location = /api/v1/auth/password/reset/ { limit_req zone=auth burst=3 nodelay; include /etc/nginx/snippets/proxy.conf; }
    location = /api/v1/contact/ { limit_req zone=contact burst=3 nodelay; include /etc/nginx/snippets/proxy.conf; }
    location /api/ { limit_req zone=api burst=40 nodelay; include /etc/nginx/snippets/proxy.conf; }
    location /gestion/ { include /etc/nginx/snippets/proxy.conf; }
    location = /healthz/ { access_log off; include /etc/nginx/snippets/proxy.conf; }

    # ---- Fichiers statiques du dashboard ----
    location /static/ {
        alias /srv/static/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $static_cache always;
    }

    # ---- Médias téléversés : servis comme données, jamais exécutés ----
    location /media/ {
        alias /srv/media/;
        location ~* \.(webp|avif)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=2592000" always;
        }
        location ~* \.pdf$ {
            # Pas de CSP ici : elle bloquerait la visionneuse PDF intégrée du navigateur.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "public, max-age=86400" always;
            types { application/pdf pdf; }
            default_type application/pdf;
        }
        location ~ { return 404; }   # toute autre extension est refusée
    }

    # ---- Frontend public (React) ----
    # Chaque adresse publique a son fichier HTML généré par le backend (SEO) ; React prend le relais
    # dans le navigateur. Toute autre adresse reçoit 404.html (page React « introuvable ») avec un code 404.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $static_cache always;
        try_files $uri $uri/ =404;
    }
}
